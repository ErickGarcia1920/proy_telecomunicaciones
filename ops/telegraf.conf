# Telegraf → InfluxDB → Grafana. Sin probar en el laboratorio: validen con `telegraf --test`.
[agent]
  interval = "5s"
  flush_interval = "5s"

# Métricas propias del portal (uptime, latencia, usuarios, tráfico, RADIUS)
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:3000/metrics"]
  metric_version = 2
  # Archivo con el METRICS_TOKEN (solo el token, sin la palabra Bearer)
  bearer_token = "/etc/telegraf/metrics.token"

# Disponibilidad y tiempo de respuesta medidos desde fuera, como lo vería un usuario
[[inputs.http_response]]
  urls = ["http://10.10.30.10/healthz"]
  response_timeout = "3s"
  method = "GET"
  response_status_code = 200

# Latencia hacia la puerta de enlace (pfSense) y hacia Internet
[[inputs.ping]]
  urls = ["10.10.20.1", "1.1.1.1"]
  count = 3

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "umg"
  bucket = "telecomunicaciones"
