# Balanceador de carga del portal (par ACTIVO / RESPALDO).
# El estado vive en un archivo compartido, por eso solo UN servidor atiende a la vez.
# Sin probar en el laboratorio: ajusten IP y validen con `haproxy -c -f haproxy.cfg`.

global
    log /dev/log local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend portal_web
    bind :80
    bind :::80 v4v6
    default_backend portal

backend portal
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host portal
    http-check expect status 200
    # portal1 atiende; portal2 solo entra si portal1 falla el health check
    server portal1 10.10.30.11:3000 check inter 2s fall 2 rise 2
    server portal2 10.10.30.12:3000 check inter 2s fall 2 rise 2 backup

# Panel de HAProxy solo desde la VLAN de gestión. Definan su propia contraseña.
listen stats
    bind 10.10.10.5:8404
    stats enable
    stats uri /haproxy
    stats refresh 5s
